<div>
   

    <div class="p-4 d-flex justify-content-center mt-2 tabla-main">
        <table class="table table-light table-striped table-hover table-responsive-sm">
            <thead class="text-center">
                <tr>
                    <th>Vendedor</th>
                    <th>Nombre-Producto</th>
                    <th>Cantidad</th>
                    <th>Importe</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th *ngIf="isAdmin">Acción</th>
                </tr>
            </thead>
            <tbody class="text-center table-group-divider">
                <tr *ngFor="let articulo of paginatedArticulos">
                    <td>{{ articulo.username }}</td>
                    <td>{{ articulo.nameproducto }}</td>
                    <td>{{ articulo.cantidad }}</td>
                    <td>{{ articulo.importe | currency:'EUR' }}</td>
                    <td>{{ articulo.dnicliente }}</td>
                    <td>{{ articulo.fecha }}</td>
                    <td>{{ articulo.hora }}</td>
                    
                    <td *ngIf="isAdmin">
                        <button class="btn border-0 btn-sm bton_accion" (click)="cancelarVenta(articulo)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-trash text-danger me-1" viewBox="0 0 16 16">
                                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                             </svg>
                        </button>
                    </td>
                </tr>
            </tbody>
            <tfoot></tfoot>
        </table>
    </div>

    <div class="position-relative d-flex justify-content-center align-items-center mb-5 mt-2 px-4" *ngIf="ventas.length > 0">
        
        <nav *ngIf="totalPages > 1">
            <ul class="pagination mb-0">
                <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index" [class.active]="i + 1 === currentPage">
                    <a class="page-link" style="cursor: pointer;" (click)="changePage(i + 1)">{{ i + 1 }}</a>
                </li>
            </ul>
        </nav>

        <div class="position-absolute end-0 pe-4">
            <button class="btn btn-success shadow-sm" (click)="descargarExcel()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-spreadsheet-fill me-2" viewBox="0 0 16 16">
                    <path d="M6 12v-2h3v2H6z"/>
                    <path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0zM9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1zM3 9h10v1h-3v2h3v1h-3v2H9v-2H6v2H5v-2H3v-1h2v-2H3V9z"/>
                </svg>
                Exportar Excel
            </button>
        </div>

    </div>
</div>
