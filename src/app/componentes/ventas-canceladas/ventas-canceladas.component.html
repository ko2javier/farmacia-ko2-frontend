<div>
    <!--<h2 class="text-center mt-4">Historial de Ventas Canceladas</h2>-->


    <div class="p-4 d-flex justify-content-center mt-2 tabla-main">
        <table class="table table-light table-striped table-hover table-responsive-sm">
            <thead class="text-center">
                <tr>
                    <th>Nombre-Producto</th>
                    <th>Cantidad</th>
                    <th>Importe Devuelto</th>
                    <th>Responsable</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody class="text-center table-group-divider">
                
                <tr *ngFor="let item of paginatedCancelaciones">
                    <td class="fw-italic">{{ item.nombreProducto }}</td>
                    <td>{{ item.cantidad }}</td>
                    <td class="text-danger fw-bold">-{{ item.importe | currency:'EUR' }}</td>
                    <td><span class="badge bg-secondary">{{ item.responsable }}</span></td>
                    <td>{{ item.fecha | date:'dd/MM/yyyy' }}</td>
                    <td>{{ item.fecha | date:'HH:mm' }}</td>
                </tr>
            </tbody>
            
            <tfoot>
            </tfoot>
        </table>
    </div>

    <nav *ngIf="totalPages > 1">
        <ul class="pagination justify-content-center">
            <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index" [class.active]="i + 1 === currentPage">
                <a class="page-link" style="cursor: pointer;" (click)="changePage(i + 1)">{{ i + 1 }}</a>
            </li>
        </ul>
    </nav>
    
    <div *ngIf="cancelaciones.length === 0" class="alert alert-warning text-center w-50 mx-auto">
        No hay registros de cancelaciones.
    </div>
</div>
