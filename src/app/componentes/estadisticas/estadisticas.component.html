<div class="contenedor-seccion container mb-5 fade-in">

  <div class="row g-4">

    <div class="col-12 col-lg-6">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-white border-0 py-3">
          <h5 class="card-title text-center text-success fw-bold m-0 d-flex align-items-center justify-content-center gap-2">
             {{ 'ESTADISTICAS.TITULO_VENTAS' | translate }}
          </h5>
        </div>

        <div class="card-body p-0 d-flex justify-content-center" style="height: 400px; overflow: hidden;">

          <ngx-charts-bar-vertical
            class="chart-container"
            [results]="ventasPorVendedor"
            [scheme]="colorSchemeVentas"
            [gradient]="true"
            [xAxis]="true"
            [yAxis]="true"
            [legend]="false"
            [showXAxisLabel]="true"
            [showYAxisLabel]="true"
            [xAxisLabel]="'ESTADISTICAS.EJE_X_VENDEDOR' | translate"
            [yAxisLabel]="'ESTADISTICAS.EJE_Y_TOTAL' | translate"
            [barPadding]="8"
            [roundEdges]="false"> </ngx-charts-bar-vertical>

          <div *ngIf="ventasPorVendedor.length === 0" class="d-flex align-items-center justify-content-center h-100 w-100 text-muted">
            <p>{{ 'ESTADISTICAS.CARGANDO' | translate }}</p>
          </div>

        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-white border-0 py-3">
          <h5 class="card-title text-center text-danger fw-bold m-0 d-flex align-items-center justify-content-center gap-2">
             {{ 'ESTADISTICAS.TITULO_CANCELACIONES' | translate }}
          </h5>
        </div>

        <div class="card-body p-0 d-flex justify-content-center" style="height: 400px; overflow: hidden;">

          <ngx-charts-bar-horizontal
            class="chart-container"
            [results]="cancelacionesPorResponsable"
            [scheme]="colorSchemeCancelaciones"
            [gradient]="true"
            [xAxis]="true"
            [yAxis]="true"
            [legend]="false"
            [showXAxisLabel]="true"
            [showYAxisLabel]="true"
            [xAxisLabel]="'ESTADISTICAS.EJE_X_CANTIDAD' | translate"
            [yAxisLabel]="'ESTADISTICAS.EJE_Y_RESPONSABLE' | translate"
            [barPadding]="8">
          </ngx-charts-bar-horizontal>

          <div *ngIf="cancelacionesPorResponsable.length === 0" class="d-flex align-items-center justify-content-center h-100 w-100 text-muted">
            <p>{{ 'ESTADISTICAS.SIN_CANCELACIONES' | translate }}</p>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
