<div class="contenedor-seccion">
  <div class="container mb-5 px-1 px-md-3">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-11">

        <!-- Filtros -->
        <div class="d-flex flex-column flex-md-row gap-2 mb-3">
          <input type="text" class="form-control form-control-sm"
                 placeholder="Buscar por usuario, acción o detalle…"
                 [(ngModel)]="filterText" (ngModelChange)="applyFilters()">
          <input type="date" class="form-control form-control-sm"
                 [(ngModel)]="filterDate" (ngModelChange)="applyFilters()">
          <button class="btn btn-outline-secondary btn-sm text-nowrap" (click)="clearFilters()" type="button">
            Clear
          </button>
        </div>

        <!-- Tabla -->
        <div class="table-responsive shadow-sm rounded">
          <table class="table table-light table-striped table-hover mb-0 table-sm align-middle" style="table-layout: fixed; width: 100%;">
            <thead class="text-center table-dark small">
              <tr>
                <th style="width: 14%;">Usuario</th>
                <th style="width: 20%;">Acción</th>
                <th style="width: 28%;">Detalle</th>
                <th style="width: 13%;">IP</th>
                <th style="width: 13%;">Fecha</th>
                <th style="width: 12%;">Hora</th>
              </tr>
            </thead>
            <tbody class="text-center table-group-divider small">
              <tr *ngFor="let log of paginatedLogs">
                <td class="text-break py-2" style="font-size: 0.82rem;">{{ log.username }}</td>
                <td class="py-2">
                  <span class="badge" [ngClass]="badgeClass(log.action)" style="font-size: 0.7rem; font-weight: normal; white-space: normal;">
                    {{ log.action }}
                  </span>
                </td>
                <td class="text-break py-2" style="font-size: 0.82rem;">{{ log.detail }}</td>
                <td class="py-2" style="font-size: 0.82rem;">{{ log.ipAddress }}</td>
                <td class="py-2" style="font-size: 0.82rem;">{{ log.fecha }}</td>
                <td class="py-2" style="font-size: 0.82rem;">{{ log.hora }}</td>
              </tr>
              <tr *ngIf="paginatedLogs.length === 0">
                <td colspan="6" class="text-center text-muted py-4">Sin registros</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Paginación -->
        <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
          <button class="btn btn-outline-primary btn-sm"
                  (click)="changePage(currentPage - 1)"
                  [disabled]="currentPage === 1">⬅</button>
          <span class="fw-bold text-dark bg-light px-2 py-2 rounded border text-nowrap small">
            {{ currentPage }} / {{ totalPages }}
          </span>
          <button class="btn btn-outline-primary btn-sm"
                  (click)="changePage(currentPage + 1)"
                  [disabled]="currentPage === totalPages">➡</button>
        </div>

      </div>
    </div>
  </div>
</div>
