<div class="container mt-5 mb-5">

  <div class="table-responsive shadow-sm rounded">
    <table class="table table-light table-striped table-hover mb-0">
      <thead class="text-center table-dark"> <tr>
        <th>DNI Cliente</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Importe</th>
        <th>Fecha</th>
      </tr>
      </thead>
      <tbody class="text-center table-group-divider">
      <tr *ngFor="let compra of paginatedCompras">
        <td>{{ compra.dnicliente }}</td>
        <td>{{ compra.producto }}</td>
        <td> {{ compra.cantidad }} </td>
        <td class="fw-bold ">{{ compra.importe | currency:'EUR' }}</td>
        <td>{{ compra.dia }}</td> </tr>

      <tr *ngIf="paginatedCompras.length === 0">
        <td colspan="5" class="py-4 text-muted">No hay compras registradas.</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-end align-items-center mt-3" *ngIf="compras.length > 0">
    <div class="d-flex align-items-center gap-2">

      <button class="btn btn-outline-primary"
              (click)="changePage(currentPage - 1)"
              [disabled]="currentPage === 1">
        ⬅ Anterior
      </button>

      <span class="fw-bold text-dark bg-light px-3 py-2 rounded border">
                Página {{ currentPage }} de {{ totalPages }}
            </span>

      <button class="btn btn-outline-primary"
              (click)="changePage(currentPage + 1)"
              [disabled]="currentPage === totalPages">
        Siguiente ➡
      </button>

    </div>
  </div>

</div>
